<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR Veículos - Gestão de Estoque</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <header class="bg-blue-900 text-white shadow-lg border-b-4 border-red-600">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-red-600 p-2.5 rounded-lg text-white shadow">
          <i class="fa-solid fa-car-side text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-wider text-white uppercase">JR VEÍCULOS</h1>
          <p class="text-xs text-blue-200 font-medium">Sistema de Gestão de Estoque</p>
        </div>
      </div>
      <span class="text-xs bg-blue-950 px-3 py-1 rounded-full text-blue-200 border border-blue-700 font-mono">v4.0 Supabase</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    <section class="lg:col-span-4 space-y-6">
      
      <!-- CSV -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-file-csv text-emerald-600 text-base"></i> Importar via CSV
        </h3>
        <p class="text-xs text-slate-500">Importe veículos em massa e salve direto no Supabase.</p>
        <div class="flex gap-2">
          <button onclick="downloadCSVTemplate()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-3 rounded-lg text-xs border border-slate-300">
            <i class="fa-solid fa-download"></i> Modelo
          </button>
          <label class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-lg text-xs cursor-pointer text-center shadow">
            <i class="fa-solid fa-upload"></i> Importar
            <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importCSV(event)">
          </label>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center border-t-4 border-t-blue-800">
          <p class="text-[10px] font-bold text-slate-500 uppercase">Total</p>
          <p id="stat-total" class="text-xl font-black text-blue-900 mt-1">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center border-t-4 border-t-red-600">
          <p class="text-[10px] font-bold text-slate-500 uppercase">Carros</p>
          <p id="stat-carros" class="text-xl font-black text-slate-800 mt-1">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center border-t-4 border-t-blue-600">
          <p class="text-[10px] font-bold text-slate-500 uppercase">Motos</p>
          <p id="stat-motos" class="text-xl font-black text-slate-800 mt-1">0</p>
        </div>
      </div>

      <!-- Form -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">Cadastrar Veículo</h2>
        <form id="vehicle-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo *</label>
            <select id="tipo" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
              <option value="Carro">🚗 Carro</option>
              <option value="Moto">🏍️ Moto</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" id="marca" required placeholder="Marca *" class="px-3 py-2 border rounded-lg text-sm">
            <input type="text" id="modelo" required placeholder="Modelo *" class="px-3 py-2 border rounded-lg text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" id="versao" placeholder="Versão" class="px-3 py-2 border rounded-lg text-sm">
            <select id="combustivel" class="px-3 py-2 border rounded-lg text-sm bg-white">
              <option value="Flex">Flex</option>
              <option value="Gasolina">Gasolina</option>
              <option value="Diesel">Diesel</option>
              <option value="Elétrico">Elétrico</option>
              <option value="Híbrido">Híbrido</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" id="cor" required placeholder="Cor *" class="px-3 py-2 border rounded-lg text-sm">
            <input type="number" id="ano" required placeholder="Ano *" class="px-3 py-2 border rounded-lg text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" id="placa" required placeholder="Placa *" class="px-3 py-2 border rounded-lg text-sm uppercase">
            <input type="text" id="km" placeholder="KM" class="px-3 py-2 border rounded-lg text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" id="preco" placeholder="Preço (R$)" class="px-3 py-2 border rounded-lg text-sm">
            <select id="status" class="px-3 py-2 border rounded-lg text-sm bg-white">
              <option value="Disponível">Disponível</option>
              <option value="Reservado">Reservado</option>
              <option value="Vendido">Vendido</option>
            </select>
          </div>
          <input type="text" id="localizacao" placeholder="Localização (Ex: Loja)" class="w-full px-3 py-2 border rounded-lg text-sm">
          <textarea id="observacao" rows="2" placeholder="Observações" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
          <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">Salvar Veículo</button>
        </form>
      </div>
    </section>

    <!-- Lista -->
    <section class="lg:col-span-8 space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-4 justify-between">
        <div class="flex bg-slate-100 p-1 rounded-lg">
          <button onclick="setTab('Todos')" id="tab-Todos" class="tab-btn px-4 py-1.5 rounded-md text-xs font-bold bg-blue-900 text-white">Todos</button>
          <button onclick="setTab('Carro')" id="tab-Carro" class="tab-btn px-4 py-1.5 rounded-md text-xs font-semibold text-slate-600">Carros</button>
          <button onclick="setTab('Moto')" id="tab-Moto" class="tab-btn px-4 py-1.5 rounded-md text-xs font-semibold text-slate-600">Motos</button>
        </div>
        <input type="text" id="search" placeholder="Buscar..." class="px-3 py-2 border rounded-lg text-sm w-full sm:w-64">
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-blue-900 text-white text-xs font-bold uppercase">
                <th class="p-4">Tipo / Veículo</th>
                <th class="p-4">Placa / Cor</th>
                <th class="p-4">Ano / KM</th>
                <th class="p-4">Local / Status</th>
                <th class="p-4 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="vehicle-list" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
        <div id="empty-state" class="hidden p-8 text-center text-slate-400">
          <p class="text-sm">Nenhum veículo encontrado.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ⚠️ SUBSTITUA PELAS SUAS CREDENCIAIS DO SUPABASE ⚠️
    const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
    const SUPABASE_KEY = "SUA_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let vehicles = [];
    let currentTab = 'Todos';

    const form = document.getElementById('vehicle-form');
    const vehicleList = document.getElementById('vehicle-list');
    const searchInput = document.getElementById('search');

    async function loadVehicles() {
      const { data, error } = await supabase.from('vehicles').select('*').order('created_at', { ascending: false });
      if (!error && data) {
        vehicles = data;
        render();
      }
    }

    // Escuta alterações no banco em tempo real
    supabase.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'vehicles' }, () => {
        loadVehicles();
      })
      .subscribe();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const placa = document.getElementById('placa').value.trim().toUpperCase();

      const { data: existing } = await supabase.from('vehicles').select('id').eq('placa', placa);
      if (existing && existing.length > 0) {
        alert('Já existe um veículo cadastrado com esta placa!');
        return;
      }

      const km = document.getElementById('km').value.replace(/\./g, '');
      const preco = document.getElementById('preco').value.replace(/\./g, '').replace(',', '.');

      const payload = {
        tipo: document.getElementById('tipo').value,
        marca: document.getElementById('marca').value.trim(),
        modelo: document.getElementById('modelo').value.trim(),
        versao: document.getElementById('versao').value.trim(),
        combustivel: document.getElementById('combustivel').value,
        cor: document.getElementById('cor').value.trim(),
        ano: parseInt(document.getElementById('ano').value, 10),
        placa: placa,
        km: km ? parseInt(km, 10) : null,
        preco: preco ? parseFloat(preco) : null,
        localizacao: document.getElementById('localizacao').value.trim() || 'Loja',
        status: document.getElementById('status').value,
        observacao: document.getElementById('observacao').value.trim()
      };

      const { error } = await supabase.from('vehicles').insert([payload]);
      if (!error) {
        form.reset();
        loadVehicles();
      } else {
        alert('Erro ao salvar veículo.');
      }
    });

    window.deleteVehicle = async (id) => {
      if (confirm('Deseja realmente remover este veículo?')) {
        await supabase.from('vehicles').delete().eq('id', id);
        loadVehicles();
      }
    };

    window.editPreco = async (id) => {
      const v = vehicles.find(item => item.id === id);
      const novoPreco = prompt(`Editar preço (${v.placa}):`, v.preco || '');
      if (novoPreco !== null) {
        const limpo = novoPreco.replace(/\./g, '').replace(',', '.').replace(/[^\d.]/g, '');
        await supabase.from('vehicles').update({ preco: limpo ? parseFloat(limpo) : null }).eq('id', id);
        loadVehicles();
      }
    };

    window.editLocalizacao = async (id) => {
      const v = vehicles.find(item => item.id === id);
      const novoLocal = prompt(`Editar localização (${v.placa}):`, v.localizacao || 'Loja');
      if (novoLocal !== null) {
        await supabase.from('vehicles').update({ localizacao: novoLocal.trim() || 'Loja' }).eq('id', id);
        loadVehicles();
      }
    };

    window.updateStatus = async (id, status) => {
      await supabase.from('vehicles').update({ status }).eq('id', id);
      loadVehicles();
    };

    window.downloadCSVTemplate = () => {
      const headers = "tipo,marca,modelo,versao,combustivel,cor,ano,placa,km,preco,status,localizacao,observacao\n";
      const example = "Carro,Toyota,Corolla,XEI,Flex,Prata,2022,ABC1D23,45000,95000.00,Disponível,Loja,Único dono\n";
      const blob = new Blob([headers + example], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'modelo_veiculos.csv';
      a.click();
    };

    window.importCSV = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const c = lines[i].split(',').map(item => item.trim().replace(/^["']|["']$/g, ''));
          if (c.length < 8) continue;
          rows.push({
            tipo: c[0] || 'Carro',
            marca: c[1] || 'N/A',
            modelo: c[2] || 'N/A',
            versao: c[3] || '',
            combustivel: c[4] || 'Flex',
            cor: c[5] || 'N/A',
            ano: parseInt(c[6], 10) || 2024,
            placa: c[7].toUpperCase().replace(/[^A-Z0-9]/g, ''),
            km: c[8] ? parseInt(c[8].replace(/\D/g, ''), 10) : null,
            preco: c[9] ? parseFloat(c[9].replace(',', '.')) : null,
            status: c[10] || 'Disponível',
            localizacao: c[11] || 'Loja',
            observacao: c[12] || ''
          });
        }
        if (rows.length > 0) {
          await supabase.from('vehicles').upsert(rows, { onConflict: 'placa' });
          loadVehicles();
          alert('Importação enviada para o Supabase!');
        }
      };
      reader.readAsText(file);
    };

    window.setTab = (tab) => {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('bg-blue-900', 'text-white');
        b.classList.add('text-slate-600');
      });
      document.getElementById(`tab-${tab}`).classList.add('bg-blue-900', 'text-white');
      render();
    };

    function render() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = vehicles.filter(v => {
        const matchesTab = currentTab === 'Todos' || v.tipo === currentTab;
        const matchesQuery = v.marca.toLowerCase().includes(query) || v.modelo.toLowerCase().includes(query) || v.placa.toLowerCase().includes(query);
        return matchesTab && matchesQuery;
      });

      document.getElementById('stat-total').innerText = vehicles.length;
      document.getElementById('stat-carros').innerText = vehicles.filter(v => v.tipo === 'Carro').length;
      document.getElementById('stat-motos').innerText = vehicles.filter(v => v.tipo === 'Moto').length;

      document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);
      vehicleList.innerHTML = filtered.map(v => `
        <tr class="hover:bg-slate-50">
          <td class="p-4 font-bold text-slate-800">${v.marca} ${v.modelo} <div class="text-xs text-slate-400 font-normal">${v.observacao || ''}</div></td>
          <td class="p-4"><span class="font-mono text-xs font-bold bg-slate-100 px-2 py-0.5 border rounded">${v.placa}</span> <div class="text-xs text-slate-500">${v.cor}</div></td>
          <td class="p-4">${v.ano} <div class="text-xs text-slate-500">${v.km ? v.km + ' km' : '-'}</div></td>
          <td class="p-4">
            <div class="text-xs font-semibold"><i class="fa-solid fa-location-dot text-red-600"></i> ${v.localizacao} <button onclick="editLocalizacao('${v.id}')" class="text-blue-800"><i class="fa-solid fa-pen text-[10px]"></i></button></div>
            <div class="text-xs text-emerald-700 font-bold">${v.preco ? 'R$ ' + Number(v.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2}) : 'Sob consulta'} <button onclick="editPreco('${v.id}')" class="text-blue-800"><i class="fa-solid fa-pen text-[10px]"></i></button></div>
            <select onchange="updateStatus('${v.id}', this.value)" class="text-xs border rounded bg-white mt-1">
              <option value="Disponível" ${v.status === 'Disponível' ? 'selected' : ''}>Disponível</option>
              <option value="Reservado" ${v.status === 'Reservado' ? 'selected' : ''}>Reservado</option>
              <option value="Vendido" ${v.status === 'Vendido' ? 'selected' : ''}>Vendido</option>
            </select>
          </td>
          <td class="p-4 text-right">
            <button onclick="deleteVehicle('${v.id}')" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
          </td>
        </tr>
      `).join('');
    }

    searchInput.addEventListener('input', render);
    loadVehicles();
  </script>
</body>
</html>
